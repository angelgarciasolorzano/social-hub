name: Frontend Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Laravel environment
        run: |
          cp .env.ci .env
          php artisan key:generate --ansi

      - name: Install npm dependencies
        run: npm run install:ci

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form --path=resources/js/shared/wayfinder

      - name: Check format
        run: npm run format:check

      - name: Check linting
        run: npm run lint:check

      - name: Check types
        run: npm run types
